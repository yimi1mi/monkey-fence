<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MonkeyFence 图标方案预览</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #141a22; color: #d7dce3; padding: 32px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #8b95a3; margin: 0 0 28px; font-size: 13px; }
  h2 { font-size: 15px; margin: 28px 0 10px; color: #9cdcfe; }
  .row { display: flex; align-items: flex-end; gap: 28px; padding: 20px; border-radius: 14px; flex-wrap: wrap; }
  .dark { background: #1a1f26; border: 1px solid #333a45; }
  .light { background: #f6f7f9; border: 1px solid #d4d8e0; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell img { display: block; image-rendering: auto; }
  .cell span { font-size: 11px; color: #8b95a3; }
  .light .cell span { color: #5d6470; }
  .badge { font-size: 12px; color: #8b95a3; margin-left: 8px; }
  code { background: #22272f; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<h1>MonkeyFence 图标方案</h1>
<p class="sub">主题：机器人操控流水线 · 配色取自应用主题（底 #1a1f26 / 强调 #4d9fff / 成功 #4ec97e）· 小尺寸（16/24/32px）使用专用的「头部 + 三状态圆点」简化版</p>

<h2>方案 A · 控制台式（推荐）<span class="badge">机器人双手扶住 DAG 流水线：绿√已完成 → 蓝◐运行中 → 灰○待办</span></h2>
<div class="row dark" id="a-dark"></div>
<div class="row light" id="a-light"></div>

<h2>方案 B · 猴耳机器人<span class="badge">呼应 MonkeyFence 品牌的猴耳造型，其余同方案 A</span></h2>
<div class="row dark" id="b-dark"></div>

<h2>方案 C · 机械爪 + 传送带<span class="badge">更字面的「操控流水线」：爪子提起运行中的节点，传送带 + 滚轮</span></h2>
<div class="row dark" id="c-dark"></div>

<h2>小尺寸简化版（ICO 内 16/24/32px 采用）</h2>
<div class="row dark" id="s-dark"></div>

<script>
const variants = {
  'a-dark':  ['icon-a-robot-dag', [512, 256, 128, 64, 48, 32, 16]],
  'a-light': ['icon-a-robot-dag', [256, 128, 64, 32]],
  'b-dark':  ['icon-b-monkey-bot', [512, 256, 128, 64, 48, 32, 16]],
  'c-dark':  ['icon-c-conveyor-claw', [512, 256, 128, 64, 48, 32, 16]],
  's-dark':  ['icon-small', [64, 48, 32]],
};
for (const [id, [name, sizes]] of Object.entries(variants)) {
  const el = document.getElementById(id);
  for (const s of sizes) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<img src="png/${name}-${s}.png" width="${s}" height="${s}"><span>${s}px</span>`;
    el.appendChild(cell);
  }
}
</script>
</body>
</html>
