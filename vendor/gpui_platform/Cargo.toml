# vendored from D:/workspace/zed/crates/gpui_platform(只读上游)。
# MonkeyFence 只在 Windows 构建:gpui_windows 指向本仓库 vendor/ 下的补丁副本,
# 其余平台分支保留源码但不再声明依赖(本仓库不跨平台发布)。
[package]
name = "gpui_platform"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
font-kit = []
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_windows/screen-capture"]
runtime_shaders = []
wayland = []
x11 = []

[dependencies]
gpui = { path = "D:/workspace/zed/crates/gpui", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { path = "../gpui_windows", default-features = false }
gpui = { path = "D:/workspace/zed/crates/gpui", default-features = false, features = [
    "windows-manifest",
] }
