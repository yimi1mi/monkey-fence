# vendored from D:/workspace/zed/crates/gpui_windows(只读上游),
# 本仓库持有补丁:IME 上屏文本在无 InputHandler 时回退为 key_char 按键分发。
# 依赖版本对齐 zed workspace 定义;zed 内部 crate 以只读 path 引用。
# screen-capture 依赖 zed 私有 scap fork,本仓库未启用该 feature,已一并移除。
[package]
name = "gpui_windows"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_windows.rs"

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture"]

[dependencies]
gpui = { path = "D:/workspace/zed/crates/gpui", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_windows = "0.33.1"
anyhow = "1.0.86"
collections = { path = "D:/workspace/zed/crates/collections" }
dunce = "1.0"
etagere = "0.2"
futures = "0.3.32"
gpui_util = { path = "D:/workspace/zed/crates/gpui_util" }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
itertools = "0.14.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
rand = "0.9"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
windows-core = "0.61"
windows-numerics = "0.2"
windows-registry = "0.5"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Data_Xml_Dom",
    "Foundation_Numerics",
    "Globalization_DateTimeFormatting",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_Notifications",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
