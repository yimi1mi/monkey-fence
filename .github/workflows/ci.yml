name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # 与开发/验收环境一致(Windows);Linux 化是后续工作
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # 2 核 runner 上并行测试线程与后台 worker/真实进程竞争,
      # 计时敏感的 saga/跨进程契约测试系统性抖动;CI 串行化换取
      # 确定性(本地开发保持默认并行)。
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
        env:
          RUST_TEST_THREADS: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
