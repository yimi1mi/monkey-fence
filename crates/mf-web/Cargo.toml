[package]
name = "mf-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror = "2"
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7", "v4"] }
sha2.workspace = true
hmac.workspace = true
mf-kernel.workspace = true
mf-agent.workspace = true
mf-terminal.workspace = true
mf-elevated.workspace = true
chrono.workspace = true
parking_lot.workspace = true
# T7a 网关外壳:loopback 绑定 + 安全头 middleware;领域路由在 #41 接入
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
log = "0.4"
mf-vcs.workspace = true
mf-installer.workspace = true
mf-skills.workspace = true
mf-plugins.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower = "0.5"

[dev-dependencies]
tempfile = "3"
uuid = { workspace = true, features = ["v7"] }
mf-kernel = { workspace = true, features = ["test-support"] }

[[bin]]
name = "mf-workbench"
path = "src/bin/mf-workbench.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes"] }
