[package]
name = "mf-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
anyhow.workspace = true
log.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dirs.workspace = true
thiserror = "2"
toml.workspace = true
uuid.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
mf-agent.workspace = true
mf-terminal.workspace = true
keyring.workspace = true
rand.workspace = true

[target.'cfg(windows)'.dependencies]
# Win32_System_Threading:T1e CoreOwnerLock 命名 mutex 与进程存活探针
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# T1e Unix 平台可编译契约:flock owner 互斥与 kill(0) 存活探针
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# 契约测试断言 handle 是真实 UUIDv7
uuid = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[[bin]]
name = "monkeyfence-core"
path = "src/bin/monkeyfence-core.rs"
