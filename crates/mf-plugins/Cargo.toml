[package]
name = "mf-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MonkeyFence 插件系统:清单、安装、权限、内置 Agent 与后台 worker 协议"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
parking_lot.workspace = true
libc = "0.2"
errno.workspace = true
dirs.workspace = true
sha2 = "0.10"
aes-gcm.workspace = true
rand.workspace = true
keyring.workspace = true
rusqlite.workspace = true
git2.workspace = true
mf-agent = { path = "../mf-agent" }
mf-skills = { path = "../mf-skills" }
mf-vcs = { path = "../mf-vcs" }
log.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
