[package]
name = "mf-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# mock 提供方仅调试用:debug 构建自动可用;发布构建如需临时启用
# 可 `cargo build --release --features mf-agent/debug-mock`
debug-mock = []

[dependencies]
anyhow.workspace = true
log.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
crossbeam-channel.workspace = true
ureq.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dirs.workspace = true
thiserror = "2"
zeroize.workspace = true
sha2.workspace = true
uuid.workspace = true
mf-skills = { path = "../mf-skills" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
git2 = { workspace = true }
tempfile = "3"
# 契约测试断言 handle 是真实 UUIDv7
uuid = { workspace = true }
# 集成测试用真实内置适配器验证 Adapter → LaunchPlan 编译链
mf-plugins = { path = "../mf-plugins" }
