[package]
name = "mf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MonkeyFence — AI code editor with agent orchestration"

[[bin]]
name = "monkeyfence"
path = "src/main.rs"

[dependencies]
zeroize.workspace = true
sha2.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
mf-core.workspace = true
mf-agent.workspace = true
mf-vcs.workspace = true
mf-skills.workspace = true
mf-plugins.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
log.workspace = true
ropey.workspace = true
nucleo-matcher.workspace = true
parking_lot.workspace = true
chrono.workspace = true
unicode-segmentation = "1.11"
ignore.workspace = true
regex.workspace = true
crossbeam-channel.workspace = true
libc = "0.2"
dirs.workspace = true
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Foundation", "Win32_System_IO", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
notify.workspace = true

[dev-dependencies]
toml.workspace = true
tempfile = "3"
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
embed-resource = "3"
