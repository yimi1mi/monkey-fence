[package]
name = "mf-fake-agent-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "fake-agent"
path = "main.rs"

# 独立测试夹具 crate:不是 MonkeyFence workspace 成员,
# 普通 build/install/release 不会产出或打包它。
[workspace]

[dependencies]
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
