[package]
name = "mf-review-probe"
version = "0.1.0"
edition = "2021"
[dependencies]
mf-agent = { path = "../../../crates/mf-agent" }
mf-plugins = { path = "../../../crates/mf-plugins" }
mf-kernel = { path = "../../../crates/mf-kernel", features = ["test-support"] }
mf-web = { path = "../../../crates/mf-web" }
anyhow = "1"
serde_json = "1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
crossbeam-channel = "0.5"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tempfile = "3"
[profile.dev]
opt-level = 0
debug = 1

[workspace]
